services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: obe
      POSTGRES_PASSWORD: obe
      POSTGRES_DB: obe
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    environment:
      ADDR: :8080
      DATABASE_URL: postgres://obe:obe@postgres:5432/obe?sslmode=disable
    ports:
      - "8080:8080"
    depends_on:
      - postgres

volumes:
  postgres_data:
