services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: obv
      POSTGRES_PASSWORD: obv
      POSTGRES_DB: obv
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    environment:
      ADDR: :8080
      DATABASE_URL: postgres://obv:obv@postgres:5432/obv?sslmode=disable
    ports:
      - "8080:8080"
    depends_on:
      - postgres

volumes:
  postgres_data:

