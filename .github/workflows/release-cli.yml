name: Release CLI

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      commit: ${{ steps.version.outputs.commit }}
      built_at: ${{ steps.version.outputs.built_at }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read and validate version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          tag="${GITHUB_REF_NAME}"
          if [[ ! "${tag}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "Tag must be valid SemVer with a v prefix, for example v0.8.0." >&2
            exit 1
          fi

          version="${tag#v}"
          file_version="$(tr -d '[:space:]' < VERSION)"
          if [[ "${file_version}" != "${version}" ]]; then
            echo "VERSION (${file_version}) must match tag (${version})." >&2
            exit 1
          fi

          {
            echo "version=${version}"
            echo "commit=$(git rev-parse --short HEAD)"
            echo "built_at=$(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          } >> "${GITHUB_OUTPUT}"

  check:
    name: Test and vet
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: |
            cli/go.sum
            backend/go.sum

      - name: Test
        run: go test ./backend/... ./cli/...

      - name: Vet
        run: go vet ./backend/... ./cli/...

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    needs:
      - validate
      - check
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: darwin
            goarch: amd64
            archive: tar.gz
          - goos: darwin
            goarch: arm64
            archive: tar.gz
          - goos: linux
            goarch: amd64
            archive: tar.gz
          - goos: linux
            goarch: arm64
            archive: tar.gz
          - goos: windows
            goarch: amd64
            archive: zip
          - goos: windows
            goarch: arm64
            archive: zip
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum

      - name: Build CLI
        shell: bash
        run: |
          set -euo pipefail

          version="${{ needs.validate.outputs.version }}"
          commit="${{ needs.validate.outputs.commit }}"
          built_at="${{ needs.validate.outputs.built_at }}"
          output_dir="dist/obe_${version}_${{ matrix.goos }}_${{ matrix.goarch }}"
          binary="obe"
          if [[ "${{ matrix.goos }}" == "windows" ]]; then
            binary="obe.exe"
          fi

          mkdir -p "${output_dir}"
          cd cli
          GOOS="${{ matrix.goos }}" GOARCH="${{ matrix.goarch }}" CGO_ENABLED=0 go build \
            -ldflags "-X github.com/obscurenv/obscurenv/cli/cmd.version=${version} -X github.com/obscurenv/obscurenv/cli/cmd.commit=${commit} -X github.com/obscurenv/obscurenv/cli/cmd.builtAt=${built_at}" \
            -o "../${output_dir}/${binary}" .

      - name: Package CLI
        shell: bash
        run: |
          set -euo pipefail

          version="${{ needs.validate.outputs.version }}"
          package_name="obe_${version}_${{ matrix.goos }}_${{ matrix.goarch }}"
          cd "dist/${package_name}"

          if [[ "${{ matrix.archive }}" == "zip" ]]; then
            zip -r "../${package_name}.zip" .
          else
            tar -czf "../${package_name}.tar.gz" .
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: obe_${{ needs.validate.outputs.version }}_${{ matrix.goos }}_${{ matrix.goarch }}
          path: dist/obe_${{ needs.validate.outputs.version }}_${{ matrix.goos }}_${{ matrix.goarch }}.${{ matrix.archive }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs:
      - validate
      - build
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate release notes
        shell: bash
        run: |
          set -euo pipefail

          tag="${GITHUB_REF_NAME}"
          version="${{ needs.validate.outputs.version }}"
          commit="${{ needs.validate.outputs.commit }}"
          built_at="${{ needs.validate.outputs.built_at }}"
          previous_tag="$(git tag --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+' | grep -v "^${tag}$" | head -n 1 || true)"

          {
            echo "Version: ${version}"
            echo "Commit: ${commit}"
            echo "Built: ${built_at}"
            echo
            echo "## Changes"
            echo
          } > release-notes.md

          if [[ -n "${previous_tag}" ]]; then
            changes="$(git log --pretty=format:'- %s (%h)' "${previous_tag}..${tag}")"
          else
            changes="$(git log --pretty=format:'- %s (%h)' "${tag}")"
          fi

          if [[ -n "${changes}" ]]; then
            printf '%s\n' "${changes}" >> release-notes.md
          else
            echo "- Initial release" >> release-notes.md
          fi

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "obe ${GITHUB_REF_NAME}" \
            --notes-file release-notes.md
